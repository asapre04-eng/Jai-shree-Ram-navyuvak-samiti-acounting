<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samiti Final</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f3e6d3}
.header{background:#ff6f00;color:#fff;padding:15px;text-align:center;font-weight:bold}
.tabs{display:flex;background:#fff;overflow:auto}
.tabs div{padding:10px;color:#ff6f00;cursor:pointer}
.active{border-bottom:3px solid #ff6f00}
input,select{width:100%;padding:6px;margin:5px 0}
button{background:#ff6f00;color:#fff;border:none;padding:6px;margin:3px}
.card{background:#fff;margin:10px;padding:10px;border-radius:10px}
</style>
</head>

<body>

<div class="header">🚩 SAMITI SYSTEM</div>

<div class="tabs">
<div onclick="page(event,'dashboard')" class="active">Dashboard</div>
<div onclick="page(event,'members')">Members</div>
<div onclick="page(event,'monthly')">Monthly</div>
<div onclick="page(event,'utsav')">Utsav</div>
<div onclick="page(event,'income')">Income</div>
<div onclick="page(event,'expense')">Expense</div>
<div onclick="page(event,'settings')">Settings</div>
</div>

<div id="app"></div>

<script>

let db;
let app;
let role="viewer";
let isAdmin=false;

let passwords={
admin:"123",
adhyaksha:"111",
upadhyaksha:"222",
member:"333"
};

let approvals={adhyaksha:false,upadhyaksha:false,member:false};

document.addEventListener("DOMContentLoaded",()=>{

app=document.getElementById("app");

firebase.initializeApp({
apiKey:"AIzaSyCkeJUlGX7Rd42uPkDJkLqaxvHLlrvezUg",
databaseURL:"https://samiti-app5-default-rtdb.asia-southeast1.firebasedatabase.app"
});

db=firebase.database();

db.ref("settings/passwords").once("value",s=>{
if(s.val()) passwords=s.val();
});

db.ref("settings/approvals").on("value",s=>{
approvals=s.val()||approvals;
});

dashboard();

});

// 🔒 EDIT CONTROL
function canEdit(v){

if(!isAdmin) return false;

// new data
if(!v || v.locked===false) return true;

// locked + approval
if(
v.locked===true &&
approvals.adhyaksha &&
approvals.upadhyaksha &&
approvals.member
){
return true;
}

return false;

}

// 🔄 RESET APPROVAL
function resetApproval(){
db.ref("settings/approvals").set({
adhyaksha:false,
upadhyaksha:false,
member:false
});
}

// DASHBOARD
function dashboard(){
app.innerHTML="<div id='out'></div>";

db.ref().on("value",s=>{
let d=s.val()||{};
let sum=o=>Object.values(o||{}).reduce((a,b)=>a+(b.a||0),0);

out.innerHTML=`
<div class='card'>Monthly ₹${sum(d.monthly)}</div>
<div class='card'>Utsav ₹${sum(d.utsav)}</div>
<div class='card'>Income ₹${sum(d.income)}</div>
<div class='card'>Expense ₹${sum(d.expense)}</div>
`;
});
}

// MEMBERS
function members(){
app.innerHTML=`
<input id="name" placeholder="Name">
<input id="post" placeholder="Post">
<button onclick="addMember()">Add</button>
<ul id="list"></ul>
`;

db.ref("members").on("value",s=>{
let d=s.val()||{};
list.innerHTML=Object.entries(d).map(([k,v])=>`
<li>
<input value="${v.name}" onchange="updateMember('${k}','name',this.value)">
<input value="${v.post}" onchange="updateMember('${k}','post',this.value)">
<button onclick="deleteMember('${k}')">❌</button>
</li>`).join("");
});
}

function addMember(){
let n=name.value.trim();
let p=post.value.trim();
if(!n)return alert("Name required");
db.ref("members").push({name:n,post:p});
name.value="";post.value="";
}

function updateMember(id,f,v){
if(!isAdmin)return alert("Admin only");
db.ref("members/"+id).update({[f]:v});
}

function deleteMember(id){
if(!isAdmin)return alert("Admin only");
db.ref("members/"+id).remove();
}

// MONTHLY
function monthly(){
app.innerHTML="<div id='list'></div>";
db.ref("members").once("value",m=>{
let mem=m.val()||{};
db.ref("monthly").on("value",s=>{
let data=s.val()||{};
list.innerHTML=Object.entries(mem).map(([id,v])=>{
let val=data[id]||{};
return `<div>${v.name}
<input value="${val.a||""}" onchange="saveM('${id}',this.value)">
</div>`;
}).join("");
});
});
}

function saveM(k,v){
db.ref("monthly/"+k).once("value",snap=>{
let val=snap.val()||{};
if(!canEdit(val))return alert("Locked");
db.ref("monthly/"+k).update({a:+v});
resetApproval();
});
}

// UTSAV
function utsav(){
app.innerHTML="<div id='list'></div>";
db.ref("members").once("value",m=>{
let mem=m.val()||{};
db.ref("utsav").on("value",s=>{
let data=s.val()||{};
list.innerHTML=Object.entries(mem).map(([id,v])=>{
let val=data[id]||{};
return `<div>${v.name}
<input value="${val.a||""}" onchange="saveU('${id}',this.value)">
</div>`;
}).join("");
});
});
}

function saveU(k,v){
db.ref("utsav/"+k).once("value",snap=>{
let val=snap.val()||{};
if(!canEdit(val))return alert("Locked");
db.ref("utsav/"+k).update({a:+v});
resetApproval();
});
}

// INCOME
function income(){
app.innerHTML=`
<input id="d" placeholder="Description">
<input id="a">
<button onclick="addInc()">Add</button>
<ul id="list"></ul>
`;

db.ref("income").on("value",s=>{
let d=s.val()||{};
list.innerHTML=Object.entries(d).map(([k,v])=>`
<li>${v.d} ₹${v.a}
<button onclick="del('${k}','income')">❌</button>
</li>`).join("");
});
}

function addInc(){
db.ref("income").push({d:d.value,a:+a.value,locked:false});
}

// EXPENSE
function expense(){
app.innerHTML=`
<input id="d" placeholder="Description">
<input id="a">
<button onclick="addExp()">Add</button>
<ul id="list"></ul>
`;

db.ref("expense").on("value",s=>{
let d=s.val()||{};
list.innerHTML=Object.entries(d).map(([k,v])=>`
<li>${v.d} ₹${v.a}
<button onclick="del('${k}','expense')">❌</button>
</li>`).join("");
});
}

function addExp(){
db.ref("expense").push({d:d.value,a:+a.value,locked:false});
}

// DELETE
function del(id,path){
db.ref(path+"/"+id).once("value",snap=>{
let val=snap.val()||{};
if(!canEdit(val))return alert("Locked");
db.ref(path+"/"+id).remove();
resetApproval();
});
}

// SETTINGS
function settings(){
app.innerHTML=`
<input id="pass">
<select id="roleSelect">
<option>admin</option>
<option>adhyaksha</option>
<option>upadhyaksha</option>
<option>member</option>
</select>
<button onclick="login()">Login</button>

<h3>Change Password</h3>
<input id="newPass">
<button onclick="changePass()">Update</button>

<h3>Lock / Approval</h3>
<button onclick="lockData()">Lock</button>
<button onclick="approve()">Approve</button>
`;
}

function login(){
let r=roleSelect.value;
if(pass.value===passwords[r]){
role=r;
isAdmin=(r==="admin");
alert("Login success");
}else alert("Wrong");
}

function changePass(){
if(role==="viewer")return alert("Login first");
passwords[role]=newPass.value;
db.ref("settings/passwords/"+role).set(newPass.value);
alert("Updated");
}

function lockData(){
if(!isAdmin)return alert("Admin only");
["monthly","income","expense","utsav"].forEach(p=>{
db.ref(p).once("value",s=>{
Object.keys(s.val()||{}).forEach(k=>{
db.ref(p+"/"+k+"/locked").set(true);
});
});
});
alert("Locked");
}

function approve(){
if(role==="admin")return alert("Admin not allowed");
db.ref("settings/approvals/"+role).set(true);
alert("Approved");
}

// ROUTE
function page(e,p){
document.querySelectorAll('.tabs div').forEach(el=>el.classList.remove('active'));
e.target.classList.add('active');

if(p==="dashboard") dashboard();
if(p==="members") members();
if(p==="monthly") monthly();
if(p==="utsav") utsav();
if(p==="income") income();
if(p==="expense") expense();
if(p==="settings") settings();
}

</script>

</body>
</html>
