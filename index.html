<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samiti Premium</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f5e6d3}
.header{background:#ff6f00;color:#fff;padding:15px;text-align:center}
.app{padding:10px;padding-bottom:70px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 6px #ccc}
.big{font-size:18px;font-weight:bold;color:#ff6f00}
input,select{width:100%;padding:6px;margin:5px 0}
button{background:#ff6f00;color:#fff;border:none;padding:6px;border-radius:6px}
.nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff}
.nav button{flex:1;background:none;color:#ff6f00}
</style>
</head>

<body>

<div class="header">🚩 JAI SHREE RAM NAVYUVAK SAMITI</div>

<div id="app" class="app"></div>

<div class="nav">
<button onclick="page('dashboard')">🏠</button>
<button onclick="page('income')">💰</button>
<button onclick="page('expense')">💸</button>
<button onclick="page('settings')">⚙️</button>
</div>

<script>

let db;
let role="viewer";
let password="123";

// INIT
document.addEventListener("DOMContentLoaded",()=>{

firebase.initializeApp({
apiKey:"AIzaSyCkeJUlGX7Rd42uPkDJkLqaxvHLlrvezUg",
databaseURL:"https://samiti-app5-default-rtdb.asia-southeast1.firebasedatabase.app"
});

db=firebase.database();

page("dashboard");

});

// DASHBOARD
function dashboard(){
app.innerHTML="<div class='cards' id='out'></div>";

db.ref().on("value",s=>{
let d=s.val()||{};
let sum=o=>Object.values(o||{}).reduce((a,b)=>a+(b.a||0),0);

let inc=sum(d.income);
let exp=sum(d.expense);
let open=d.settings?.open||0;

out.innerHTML=`
<div class='card'>Income<br><div class='big'>₹${inc}</div></div>
<div class='card'>Expense<br><div class='big'>₹${exp}</div></div>
<div class='card'>Opening<br><div class='big'>₹${open}</div></div>
<div class='card'>Balance<br><div class='big'>₹${inc-exp+open}</div></div>
`;
});
}

// INCOME
function income(){
app.innerHTML=`
<h3>Income</h3>
<input id="d" placeholder="Description">
<input id="a" type="number" placeholder="Amount">
<button onclick="addInc()">Add</button>
<ul id="list"></ul>
`;

db.ref("income").on("value",s=>{
let d=s.val()||{};
list.innerHTML=Object.entries(d).map(([k,v])=>
`<li>${v.d} - ₹${v.a} <button onclick="del('${k}','income')">X</button></li>`
).join("");
});
}

function addInc(){
db.ref("income").push({d:d.value,a:+a.value});
}

// EXPENSE
function expense(){
app.innerHTML=`
<h3>Expense</h3>
<input id="d" placeholder="Description">
<input id="a" type="number" placeholder="Amount">
<button onclick="addExp()">Add</button>
<ul id="list"></ul>
`;

db.ref("expense").on("value",s=>{
let d=s.val()||{};
list.innerHTML=Object.entries(d).map(([k,v])=>
`<li>${v.d} - ₹${v.a} <button onclick="del('${k}','expense')">X</button></li>`
).join("");
});
}

function addExp(){
db.ref("expense").push({d:d.value,a:+a.value});
}

// DELETE
function del(id,path){
db.ref(path+"/"+id).remove();
}

// SETTINGS
function settings(){
app.innerHTML=`
<h3>Settings</h3>

<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>

<h4>Change Password</h4>
<input id="newPass">
<button onclick="changePass()">Change</button>

<h4>Opening Balance</h4>
<input id="openAmt" type="number">
<button onclick="saveOpen()">Save</button>
`;
}

// LOGIN
function login(){
if(pass.value===password){
role="admin";
alert("Login success");
}else alert("Wrong");
}

// CHANGE PASSWORD
function changePass(){
password=newPass.value;
alert("Password changed");
}

// OPENING BALANCE
function saveOpen(){
db.ref("settings/open").set(+openAmt.value);
}

// ROUTE
function page(p){
if(p==="dashboard") dashboard();
if(p==="income") income();
if(p==="expense") expense();
if(p==="settings") settings();
}

</script>

</body>
</html>
