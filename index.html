<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samiti Final Stable</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f3e6d3}
.header{background:#ff6f00;color:#fff;padding:15px;text-align:center;font-weight:bold}
.tabs{display:flex;background:#fff;overflow:auto}
.tabs div{padding:10px;color:#ff6f00;cursor:pointer}
.active{border-bottom:3px solid #ff6f00}
.card{background:#fff;margin:10px;padding:10px;border-radius:10px}
button{background:#ff6f00;color:#fff;border:none;padding:6px;margin:3px}
input,select{width:100%;padding:6px;margin:5px 0}
</style>
</head>

<body>

<div class="header">🚩 SAMITI SYSTEM</div>

<div class="tabs">
<div onclick="page(event,'dashboard')" class="active">Dashboard</div>
<div onclick="page(event,'members')">Members</div>
<div onclick="page(event,'monthly')">Monthly</div>
<div onclick="page(event,'utsav')">Utsav</div>
<div onclick="page(event,'income')">Income</div>
<div onclick="page(event,'expense')">Expense</div>
<div onclick="page(event,'settings')">Settings</div>
</div>

<div id="app"></div>

<script>

// 🔥 INIT
firebase.initializeApp({
apiKey:"AIzaSyCkeJUlGX7Rd42uPkDJkLqaxvHLlrvezUg",
databaseURL:"https://samiti-app5-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db=firebase.database();

let role="viewer";
let approvals={adhyaksha:false,upadhyaksha:false,member:false};

// approvals load
db.ref("settings/approvals").on("value",s=>{
approvals=s.val()||approvals;
});

// 🔒 EDIT CONTROL
function canEdit(v){

if(role!=="admin") return false;

// new data
if(!v || v.locked===false) return true;

// locked + approval
if(
v.locked===true &&
approvals.adhyaksha &&
approvals.upadhyaksha &&
approvals.member
){
return true;
}

return false;
}

// 🔄 RESET
function resetApproval(){
db.ref("settings/approvals").set({
adhyaksha:false,
upadhyaksha:false,
member:false
});
}

// DASHBOARD
function dashboard(){
app.innerHTML="<div id='out'></div>";

db.ref().on("value",s=>{
let d=s.val()||{};
let sum=o=>Object.values(o||{}).reduce((a,b)=>a+(b.a||0),0);

out.innerHTML=`
<div class='card'>Monthly ₹${sum(d.monthly)}</div>
<div class='card'>Utsav ₹${sum(d.utsav)}</div>
<div class='card'>Income ₹${sum(d.income)}</div>
<div class='card'>Expense ₹${sum(d.expense)}</div>
`;
});
}

// MEMBERS
function members(){
app.innerHTML=`
<input id="name"><input id="post">
<button onclick="addMember()">Add</button>
<ul id="list"></ul>
`;

db.ref("members").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li><input value="${v.name}" onchange="update('${k}',this.value)"> (${v.post})</li>`
).join("");
});
}

function addMember(){
db.ref("members").push({name:name.value,post:post.value});
}

function update(k,v){
db.ref("members/"+k).update({name:v});
}

// MONTHLY
function monthly(){
app.innerHTML=`<div id="list"></div>`;

db.ref("members").once("value",m=>{
let mem=m.val()||{};
db.ref("monthly").on("value",s=>{
let data=s.val()||{};

list.innerHTML=Object.entries(mem).map(([id,v])=>{
let val=data[id]||{};
return `
<div>
${v.name}
<input value="${val.a||""}" onchange="saveM('${id}',this.value)">
</div>`;
}).join("");
});
});
}

function saveM(k,v){
db.ref("monthly/"+k).once("value",snap=>{
let val=snap.val()||{};

if(!canEdit(val)) return alert("Locked");

db.ref("monthly/"+k).update({a:+v,locked:false});
resetApproval();
});
}

// UTSAV
function utsav(){
app.innerHTML=`<div id="list"></div>`;

db.ref("members").once("value",m=>{
let mem=m.val()||{};
db.ref("utsav").on("value",s=>{
let data=s.val()||{};

list.innerHTML=Object.entries(mem).map(([id,v])=>{
let val=data[id]||{};
return `
<div>
${v.name}
<input value="${val.a||""}" onchange="saveU('${id}',this.value)">
</div>`;
}).join("");
});
});
}

function saveU(k,v){
db.ref("utsav/"+k).once("value",snap=>{
let val=snap.val()||{};

if(!canEdit(val)) return alert("Locked");

db.ref("utsav/"+k).update({a:+v,locked:false});
resetApproval();
});
}

// INCOME
function income(){
app.innerHTML=`
<input id="d"><input id="a">
<button onclick="addInc()">Add</button>
<ul id="list"></ul>
`;

db.ref("income").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>${v.d} ₹${v.a}
<button onclick="del('${k}','income')">❌</button>
</li>`
).join("");
});
}

function addInc(){
db.ref("income").push({d:d.value,a:+a.value,locked:false});
}

// EXPENSE
function expense(){
app.innerHTML=`
<input id="d"><input id="a">
<button onclick="addExp()">Add</button>
<ul id="list"></ul>
`;

db.ref("expense").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>${v.d} ₹${v.a}
<button onclick="del('${k}','expense')">❌</button>
</li>`
).join("");
});
}

function addExp(){
db.ref("expense").push({d:d.value,a:+a.value,locked:false});
}

// DELETE
function del(id,path){
db.ref(path+"/"+id).once("value",snap=>{
let val=snap.val()||{};
if(!canEdit(val)) return alert("Locked");
db.ref(path+"/"+id).remove();
resetApproval();
});
}

// SETTINGS
function settings(){
app.innerHTML=`
<input id="pass" placeholder="admin=123">
<button onclick="login()">Login</button>
<br><br>
<button onclick="lockData()">🔒 Lock</button>
<button onclick="approve()">✅ Approve</button>
`;
}

function login(){
if(pass.value==="123"){
role="admin";
alert("Admin login");
}
}

function lockData(){
if(role!=="admin") return alert("Admin only");

["income","expense","monthly","utsav"].forEach(p=>{
db.ref(p).once("value",s=>{
Object.keys(s.val()||{}).forEach(k=>{
db.ref(p+"/"+k+"/locked").set(true);
});
});
});
alert("Locked");
}

function approve(){
db.ref("settings/approvals/adhyaksha").set(true);
db.ref("settings/approvals/upadhyaksha").set(true);
db.ref("settings/approvals/member").set(true);
alert("Approved");
}

// ROUTE
function page(e,p){
document.querySelectorAll('.tabs div').forEach(el=>el.classList.remove('active'));
e.target.classList.add('active');

if(p==="dashboard") dashboard();
if(p==="members") members();
if(p==="monthly") monthly();
if(p==="utsav") utsav();
if(p==="income") income();
if(p==="expense") expense();
if(p==="settings") settings();
}

dashboard();

</script>

</body>
</html>
