<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samiti Ultimate</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f3e6d3}
.header{background:#ff6f00;color:#fff;padding:15px;text-align:center;font-weight:bold}

.tabs{display:flex;background:#fff;overflow:auto}
.tabs div{padding:10px;color:#ff6f00;cursor:pointer}
.active{border-bottom:3px solid #ff6f00}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 6px #ccc}
.big{font-size:18px;color:#ff6f00;font-weight:bold}

input,select{width:100%;padding:6px;margin:5px 0}
button{background:#ff6f00;color:#fff;border:none;padding:6px;border-radius:5px;margin:3px}
</style>
</head>

<body>

<div class="header">🚩 SAMITI SYSTEM</div>

<div class="tabs">
<div onclick="page('dashboard')" class="active">Dashboard</div>
<div onclick="page('members')">Members</div>
<div onclick="page('monthly')">Monthly</div>
<div onclick="page('utsav')">Utsav</div>
<div onclick="page('income')">Income</div>
<div onclick="page('expense')">Expense</div>
<div onclick="page('settings')">Settings</div>
</div>

<div id="app"></div>

<script>

let db;
let role="viewer";

let passwords={
admin:"123",
adhyaksha:"111",
upadhyaksha:"222",
member:"333"
};

const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// INIT
document.addEventListener("DOMContentLoaded",()=>{
firebase.initializeApp({
apiKey:"AIzaSyCkeJUlGX7Rd42uPkDJkLqaxvHLlrvezUg",
databaseURL:"https://samiti-app5-default-rtdb.asia-southeast1.firebasedatabase.app"
});

db=firebase.database();

db.ref("settings/passwords").once("value",s=>{
if(s.val()) passwords=s.val();
});

page("dashboard");
});

// PENALTY
function penalty(d){
if(!d) return 0;
let day=new Date(d).getDate();
return day>1?(day-1)*10:0;
}

// DASHBOARD
function dashboard(){
app.innerHTML="<div class='cards' id='out'></div>";

db.ref().on("value",s=>{
let d=s.val()||{};
let sum=o=>Object.values(o||{}).reduce((a,b)=>a+(b.a||0),0);

let monthly=sum(d.monthly);
let utsav=sum(d.utsav);
let income=sum(d.income);
let expense=sum(d.expense);

let pen=0;
Object.values(d.monthly||{}).forEach(v=>pen+=penalty(v.d));

let open=d.settings?.open||0;

out.innerHTML=`
<div class='card'>Opening<br><div class='big'>₹${open}</div></div>
<div class='card'>Monthly<br><div class='big'>₹${monthly}</div></div>
<div class='card'>Penalty<br><div class='big'>₹${pen}</div></div>
<div class='card'>Utsav<br><div class='big'>₹${utsav}</div></div>
<div class='card'>Income<br><div class='big'>₹${income}</div></div>
<div class='card'>Expense<br><div class='big'>₹${expense}</div></div>
<div class='card'>Balance<br><div class='big'>₹${open+monthly+pen+utsav+income-expense}</div></div>
`;
});
}

// MEMBERS
function members(){
app.innerHTML=`
<input id="name"><input id="post">
<button onclick="addMember()">Add</button>
<ul id="list"></ul>
`;

db.ref("members").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li><input value="${v.name}" onchange="update('${k}',this.value)"> (${v.post})</li>`
).join("");
});
}

function addMember(){
db.ref("members").push({name:name.value,post:post.value});
}

function update(k,v){
db.ref("members/"+k).update({name:v});
}

// MONTHLY
function monthly(){
app.innerHTML=`
<select id="month" onchange="loadMonthly()">
${months.map(m=>`<option>${m}</option>`)}
</select>
<div id="list"></div>
`;

loadMonthly();
}

function loadMonthly(){
db.ref("members").once("value",m=>{
let mem=m.val()||{};
db.ref("monthly").on("value",s=>{
let data=s.val()||{};
let mth=month.value;

list.innerHTML=Object.entries(mem).map(([id,v])=>{
let key=id+"_"+mth;
let val=data[key]||{};
return `
<div>
${v.name}
<input value="${val.a||""}" onchange="save('${key}','a',this.value)">
<input type="date" value="${val.d||""}" onchange="save('${key}','d',this.value)">
Penalty ₹${penalty(val.d)}
</div>`;
}).join("");
});
});
}

function save(k,t,v){
db.ref("monthly/"+k).update({[t]:t==="a"?+v:v});
}

// UTSAV
function utsav(){
app.innerHTML=`
<input id="name"><input id="amt">
<button onclick="addU()">Add</button>
<ul id="list"></ul>
`;

db.ref("utsav").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>${v.name} ₹${v.a}</li>`
).join("");
});
}

function addU(){
db.ref("utsav").push({name:name.value,a:+amt.value});
}

// INCOME
function income(){
app.innerHTML=`
<input id="d"><input id="a">
<button onclick="addInc()">Add</button>
<ul id="list"></ul>
`;

db.ref("income").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>${v.d} ₹${v.a}</li>`
).join("");
});
}

function addInc(){
db.ref("income").push({d:d.value,a:+a.value});
}

// EXPENSE
function expense(){
app.innerHTML=`
<input id="d"><input id="a">
<button onclick="addExp()">Add</button>
<ul id="list"></ul>
`;

db.ref("expense").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>${v.d} ₹${v.a}</li>`
).join("");
});
}

function addExp(){
db.ref("expense").push({d:d.value,a:+a.value});
}

// SETTINGS
function settings(){
app.innerHTML=`
<input id="pass">
<select id="roleSelect">
<option>admin</option>
<option>adhyaksha</option>
<option>upadhyaksha</option>
<option>member</option>
</select>
<button onclick="login()">Login</button>

<h3>Change Password</h3>
<input id="newPass">
<button onclick="changePass()">Update</button>

<h3>Opening Balance</h3>
<input id="openAmt" type="number">
<button onclick="saveOpen()">Save</button>
`;
}

function login(){
let r=roleSelect.value;
if(pass.value===passwords[r]){
role=r;
alert(r+" login");
}else alert("Wrong");
}

function changePass(){
passwords[role]=newPass.value;
db.ref("settings/passwords").set(passwords);
alert("Updated");
}

function saveOpen(){
db.ref("settings/open").set(+openAmt.value);
}

// ROUTE
function page(p){
document.querySelectorAll('.tabs div').forEach(e=>e.classList.remove('active'));
event.target.classList.add('active');

if(p==="dashboard") dashboard();
if(p==="members") members();
if(p==="monthly") monthly();
if(p==="utsav") utsav();
if(p==="income") income();
if(p==="expense") expense();
if(p==="settings") settings();
}

</script>

</body>
</html>
