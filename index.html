<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samiti Ultimate Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f5e6d3}
.header{background:#ff6f00;color:#fff;padding:15px;text-align:center}
.mode{font-size:12px}
.app{padding:10px;padding-bottom:70px}
.card{background:#fff;padding:10px;margin:10px 0;border-radius:10px}
input,select{width:100%;padding:6px;margin:5px 0}
button{background:#ff6f00;color:#fff;border:none;padding:6px;margin:3px;border-radius:5px}
.nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff}
.nav button{flex:1;background:none;color:#ff6f00}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:5px;text-align:center}
.lock{color:red;font-weight:bold}
</style>
</head>

<body>

<div class="header">
🚩 SAMITI ULTIMATE PRO
<div id="mode">👁 View Mode</div>
</div>

<div id="app" class="app"></div>

<div class="nav">
<button onclick="page('dashboard')">🏠</button>
<button onclick="page('members')">👥</button>
<button onclick="page('masik')">📅</button>
<button onclick="page('income')">💰</button>
<button onclick="page('expense')">💸</button>
<button onclick="page('logs')">📊</button>
<button onclick="page('settings')">⚙️</button>
</div>

<script>

let db;
let role="viewer";
let password="123";

let approvals={adhyaksha:false,upadhyaksha:false,member:false};

// INIT
document.addEventListener("DOMContentLoaded",()=>{

firebase.initializeApp({
apiKey:"AIzaSyCkeJUlGX7Rd42uPkDJkLqaxvHLlrvezUg",
databaseURL:"https://samiti-app5-default-rtdb.asia-southeast1.firebasedatabase.app"
});

db=firebase.database();

db.ref("settings/approvals").on("value",s=>{
approvals=s.val()||approvals;
});

page("dashboard");

});

// UTILS
function penalty(d){
if(!d)return 0;
let day=new Date(d).getDate();
return day>1?(day-1)*10:0;
}

function logAction(action,detail){
db.ref("auditLogs").push({
action,detail,by:role,time:Date.now()
});
}

function resetApproval(){
db.ref("settings/approvals").set({
adhyaksha:false,upadhyaksha:false,member:false
});
}

function canEdit(v){
if(!v.locked) return true;
return approvals.adhyaksha && approvals.upadhyaksha && approvals.member;
}

// LOGIN
function login(){
if(pass.value===password){
role=roleSelect.value;
mode.innerText="🟢 "+role;
}else alert("Wrong");
}

// APPROVAL
function approve(){
if(role==="admin") return alert("Admin approve nahi karega");

db.ref("settings/approvals/"+role).set(true);
logAction("approval",role+" approved");
}

// LOCK
function lockData(){
["monthly","income","expense"].forEach(p=>{
db.ref(p).once("value",s=>{
Object.keys(s.val()||{}).forEach(k=>{
db.ref(p+"/"+k+"/locked").set(true);
});
});
});
logAction("lock","Old data locked");
alert("Locked");
}

// DASHBOARD
function dashboard(){
app.innerHTML="<div id='out'></div>";

db.ref().on("value",s=>{
let d=s.val()||{};
let sum=o=>Object.values(o||{}).reduce((a,b)=>a+(b.a||0),0);

let masik=0,pen=0;
Object.values(d.monthly||{}).forEach(v=>{
masik+=v.a||0;
pen+=penalty(v.d);
});

let open=d.settings?.open||0;

out.innerHTML=`
Masik ₹${masik} + ₹${pen}<br>
Income ₹${sum(d.income)}<br>
Expense ₹${sum(d.expense)}<br>
Balance ₹${masik+pen+sum(d.income)-sum(d.expense)+open}
`;
});
}

// MEMBERS
function members(){
app.innerHTML=`
<input id="name"><input id="post">
<button onclick="addMember()">Add</button>
<ul id="list"></ul>
`;

db.ref("members").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>
<input value="${v.name}" onchange="update('${k}',this.value)">
(${v.post})
</li>`
).join("");
});
}

function addMember(){
db.ref("members").push({name:name.value,post:post.value});
}

function update(k,v){
db.ref("members/"+k).update({name:v});
}

// MASIK
const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function masik(){
app.innerHTML=`
<select id="month" onchange="loadMasik()">
${months.map(m=>`<option>${m}</option>`)}
</select>
<div id="table"></div>`;
loadMasik();
}

function loadMasik(){
db.ref("members").once("value",mSnap=>{
let mem=mSnap.val()||{};
db.ref("monthly").on("value",snap=>{
let data=snap.val()||{};
let m=month.value;

let html="<table><tr><th>Name</th><th>Amt</th><th>Date</th><th>Penalty</th></tr>";

Object.entries(mem).forEach(([id,v])=>{
let key=id+"_"+m;
let val=data[key]||{};

html+=`
<tr>
<td>${v.name}</td>
<td><input ${!canEdit(val)?"disabled":""} value="${val.a||""}" onchange="save('${key}','a',this.value)"></td>
<td><input type="date" value="${val.d||""}" onchange="save('${key}','d',this.value)"></td>
<td>₹${penalty(val.d)}</td>
</tr>`;
});

html+="</table>";
table.innerHTML=html;
});
});
}

function save(k,t,v){
db.ref("monthly/"+k).update({[t]:t==="a"?+v:v});
logAction("masik_update",k);
resetApproval();
}

// INCOME
function income(){
app.innerHTML=`
<input id="d"><input id="a">
<button onclick="addInc()">Add</button>
<ul id="list"></ul>
`;

db.ref("income").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>
${v.d} ₹${v.a}
${canEdit(v)?`<button onclick="del('${k}','income')">X</button>`:"<span class='lock'>🔒</span>"}
</li>`
).join("");
});
}

function addInc(){
db.ref("income").push({d:d.value,a:+a.value,locked:false});
logAction("income_add",d.value);
}

// EXPENSE
function expense(){
app.innerHTML=`
<input id="d"><input id="a">
<button onclick="addExp()">Add</button>
<ul id="list"></ul>
`;

db.ref("expense").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>
${v.d} ₹${v.a}
${canEdit(v)?`<button onclick="del('${k}','expense')">X</button>`:"<span class='lock'>🔒</span>"}
</li>`
).join("");
});
}

function addExp(){
db.ref("expense").push({d:d.value,a:+a.value,locked:false});
logAction("expense_add",d.value);
}

function del(id,path){
db.ref(path+"/"+id).remove();
logAction("delete",path);
resetApproval();
}

// LOGS
function logs(){
app.innerHTML="<ul id='list'></ul>";

db.ref("auditLogs").limitToLast(50).on("value",s=>{
list.innerHTML=Object.values(s.val()||{}).reverse().map(v=>
`<li>${v.by} → ${v.action}<br>${v.detail}<br><small>${new Date(v.time).toLocaleString()}</small></li>`
).join("");
});
}

// SETTINGS
function settings(){
app.innerHTML=`
<input id="pass">
<select id="roleSelect">
<option>admin</option>
<option>adhyaksha</option>
<option>upadhyaksha</option>
<option>member</option>
</select>

<button onclick="login()">Login</button>
<button onclick="lockData()">Lock</button>
<button onclick="approve()">Approve</button>
`;
}

// ROUTING
function page(p){
if(p==="dashboard") dashboard();
if(p==="members") members();
if(p==="masik") masik();
if(p==="income") income();
if(p==="expense") expense();
if(p==="logs") logs();
if(p==="settings") settings();
}

</script>

</body>
</html>
