<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samiti Final Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f3e6d3}
.header{background:#ff6f00;color:#fff;padding:15px;text-align:center;font-weight:bold}

.tabs{display:flex;background:#fff;overflow:auto}
.tabs div{padding:10px;color:#ff6f00;cursor:pointer}
.active{border-bottom:3px solid #ff6f00}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 6px #ccc}
.big{font-size:18px;color:#ff6f00;font-weight:bold}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}
.box{background:#fff;padding:10px;border-radius:10px;text-align:center}

input,select{width:100%;padding:6px;margin:5px 0}
button{background:#ff6f00;color:#fff;border:none;padding:6px;border-radius:5px;margin:3px}
</style>
</head>

<body>

<div class="header">🚩 JAI SHREE RAM NAVYUVAK SAMITI</div>

<div class="tabs">
<div onclick="page('dashboard')" class="active">Dashboard</div>
<div onclick="page('members')">Sadasya</div>
<div onclick="page('masik')">Masik</div>
<div onclick="page('income')">Aay</div>
<div onclick="page('expense')">Vyay</div>
<div onclick="page('settings')">Settings</div>
</div>

<div id="app"></div>

<script>

let db;
let role="viewer";
let password="123";

let approvals={adhyaksha:false,upadhyaksha:false,member:false};

const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// INIT
document.addEventListener("DOMContentLoaded",()=>{
firebase.initializeApp({
apiKey:"AIzaSyCkeJUlGX7Rd42uPkDJkLqaxvHLlrvezUg",
databaseURL:"https://samiti-app5-default-rtdb.asia-southeast1.firebasedatabase.app"
});

db=firebase.database();

// load password
db.ref("settings/password").once("value",s=>{
password=s.val()||"123";
});

// approval
db.ref("settings/approvals").on("value",s=>{
approvals=s.val()||approvals;
});

page("dashboard");
});

// DASHBOARD
function dashboard(){
app.innerHTML="<div class='cards' id='out'></div>";

db.ref().on("value",s=>{
let d=s.val()||{};
let sum=o=>Object.values(o||{}).reduce((a,b)=>a+(b.a||0),0);

let masik=sum(d.monthly);
let inc=sum(d.income);
let exp=sum(d.expense);
let open=d.settings?.open||0;

out.innerHTML=`
<div class='card'>Masik<br><div class='big'>₹${masik}</div></div>
<div class='card'>Utsav<br><div class='big'>₹0</div></div>
<div class='card'>Aay<br><div class='big'>₹${inc}</div></div>
<div class='card'>Vyay<br><div class='big'>₹${exp}</div></div>
<div class='card'>Balance<br><div class='big'>₹${masik+inc-exp+open}</div></div>
`;
});
}

// MEMBERS
function members(){
app.innerHTML=`
<input id="name" placeholder="Name">
<input id="post" placeholder="Post">
<button onclick="addMember()">Add</button>
<ul id="list"></ul>
`;

db.ref("members").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li><input value="${v.name}" onchange="update('${k}',this.value)"> (${v.post})</li>`
).join("");
});
}

function addMember(){
db.ref("members").push({name:name.value,post:post.value});
}

function update(k,v){
db.ref("members/"+k).update({name:v});
}

// MASIK
function masik(){
app.innerHTML="<div class='grid' id='grid'></div>";

db.ref("monthly").on("value",s=>{
let d=s.val()||{};

grid.innerHTML=months.map(m=>{
let total=Object.keys(d).filter(k=>k.includes("_"+m)).length;
return `<div class='box'>${m}<br><b>${total}/24</b></div>`;
}).join("");
});
}

// INCOME
function income(){
app.innerHTML=`
<input id="d" placeholder="Description">
<input id="a" type="number">
<button onclick="addInc()">Add</button>
<ul id="list"></ul>
`;

db.ref("income").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>${v.d} - ₹${v.a} <button onclick="del('${k}','income')">X</button></li>`
).join("");
});
}

function addInc(){
db.ref("income").push({d:d.value,a:+a.value});
}

// EXPENSE
function expense(){
app.innerHTML=`
<input id="d" placeholder="Description">
<input id="a" type="number">
<button onclick="addExp()">Add</button>
<ul id="list"></ul>
`;

db.ref("expense").on("value",s=>{
list.innerHTML=Object.entries(s.val()||{}).map(([k,v])=>
`<li>${v.d} - ₹${v.a} <button onclick="del('${k}','expense')">X</button></li>`
).join("");
});
}

function addExp(){
db.ref("expense").push({d:d.value,a:+a.value});
}

function del(id,path){
db.ref(path+"/"+id).remove();
}

// SETTINGS
function settings(){
app.innerHTML=`
<h3>Login</h3>
<input id="pass" placeholder="Password">
<select id="roleSelect">
<option>admin</option>
<option>adhyaksha</option>
<option>upadhyaksha</option>
<option>member</option>
</select>
<button onclick="login()">Login</button>

<h3>Password Change</h3>
<input id="newPass">
<button onclick="changePass()">Change</button>

<h3>Opening Balance</h3>
<input id="openAmt" type="number">
<button onclick="saveOpen()">Save</button>

<h3>Lock / Approval</h3>
<button onclick="lockData()">Lock</button>
<button onclick="approve()">Approve</button>

Adhyaksha: ${approvals.adhyaksha?"✔":"❌"}<br>
Upadhyaksha: ${approvals.upadhyaksha?"✔":"❌"}<br>
Member: ${approvals.member?"✔":"❌"}
`;
}

function login(){
if(pass.value===password){
role=roleSelect.value;
alert(role);
}else alert("Wrong");
}

function changePass(){
password=newPass.value;
db.ref("settings/password").set(password);
alert("Password Updated");
}

function saveOpen(){
db.ref("settings/open").set(+openAmt.value);
}

// LOCK
function lockData(){
["monthly","income","expense"].forEach(p=>{
db.ref(p).once("value",s=>{
Object.keys(s.val()||{}).forEach(k=>{
db.ref(p+"/"+k+"/locked").set(true);
});
});
});
alert("Locked");
}

// APPROVE
function approve(){
db.ref("settings/approvals/"+role).set(true);
alert("Approved");
}

// ROUTE
function page(p){
document.querySelectorAll('.tabs div').forEach(e=>e.classList.remove('active'));
event.target.classList.add('active');

if(p==="dashboard") dashboard();
if(p==="members") members();
if(p==="masik") masik();
if(p==="income") income();
if(p==="expense") expense();
if(p==="settings") settings();
}

</script>

</body>
</html>
